<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Verificación de correo - Las Cotorras</title>
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background-color: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 0;
  }

  .container {
    max-width: 600px;
    margin: 50px auto;
    background-color: #1e293b;
    padding: 40px 30px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
  }

  .container img {
    height: 50px;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 26px;
    color: #38bdf8;
    margin-bottom: 15px;
  }

  p {
    font-size: 16px;
    color: #e2e8f0;
    margin-bottom: 20px;
  }

  .code {
    font-size: 28px;
    font-weight: bold;
    color: #22c55e;
    background-color: rgba(255,255,255,0.05);
    padding: 15px 25px;
    border-radius: 10px;
    display: inline-block;
    letter-spacing: 4px;
    margin: 20px 0;
  }

  .footer {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 25px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Verifica tu correo</h1>
    <p>Tu código de verificación es:</p>
    <div class="code">{{CODE}}</div>
    <p>Este código expirará en 10 minutos.</p>
    <div class="footer">Si no solicitaste este correo, ignóralo.</div>
  </div>
</body>
</html>
